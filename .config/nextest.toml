# Refuse to run under a nextest older than the fixed release: GHSA-vc25-qg58-w57c is fixed in
# 0.9.150, and CI installs exactly that version (an older nextest exits 92 REQUIRED_VERSION_NOT_MET).
nextest-version = "0.9.150"

# `cargo nextest run` (used by `cargo xtask ci`) runs every test in a process of its own, in parallel.

[test-groups]
# NVENC sessions are a limited resource on consumer GPUs.
nvenc = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(filmcraft-platform) and (binary(/nvenc/) or test(/nvenc/))"
test-group = "nvenc"

# A throughput gate: it measures one core's speed, so nothing else runs beside it.
[[profile.default.overrides]]
filter = "package(filmcraft-render) and binary(mixer_perf)"
threads-required = "num-test-threads"

# Playback progress during a continuous drag is wall-clock-sensitive: reserve the
# runner's test slots so parallel decode/render tests cannot starve its workers.
# Keep the original five-frame and newer-revision assertions unchanged.
[[profile.default.overrides]]
filter = "package(filmcraft-ui-egui) and test(/^perf_ui::program_monitor_plays_on_while_a_value_is_dragged$/)"
threads-required = "num-test-threads"
